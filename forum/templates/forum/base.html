{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}My Forum{% endblock %}</title>

    <link rel="stylesheet" href="{% static 'forum/styles.css' %}">

    <script defer src="https://cdn.jsdelivr.net/npm/htmx.org@4.0.0/dist/htmx.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/htmx.org@4.0.0/dist/ext/hx-alpine-compat.js"></script>
    <script src="//unpkg.com/alpinejs" defer></script>
    <style>
    /* Base */
    * {
        box-sizing: border-box;
    }
    
    [x-cloak] {
        display: none !important;
    }
    
    html,
    body {
        margin: 0;
        min-height: 100%;
    }
    
    body {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
            sans-serif;
    
        background: #f4f4f5;
        color: #18181b;
    
        display: grid;
        grid-template-columns: minmax(0, 1fr) 280px;
        min-height: 100vh;
    }
    
    button,
    input,
    textarea {
        font: inherit;
    }
    
    button {
        cursor: pointer;
    }
    
    
    /* Main layout */
    
    #main {
        min-width: 0;
    }
    
    header {
        padding: 1.5rem 2rem;
        background: #18181b;
        color: white;
    }
    
    header h1 {
        margin: 0;
        font-size: 1.5rem;
        letter-spacing: 0.05em;
    }
    
    main {
        max-width: 1000px;
        margin: 0 auto;
        padding: 2rem;
    }

    #main-content {
        display: grid;
        grid-template-columns: 20% 80%;
        gap: 2rem;
    }
    
    
    /* Sections */
    
    .forum-section,
    .post-section {
        margin-bottom: 2rem;
    }
    
    h2 {
        display: flex;
        align-items: center;
        gap: 0.5rem;
    
        margin: 0 0 1rem;
        font-size: 1.25rem;
    }
    
    h2 button {
        width: 1.75rem;
        height: 1.75rem;
    
        padding: 0;
        border: 0;
        border-radius: 0.375rem;
    
        background: #18181b;
        color: white;
    
        font-size: 1.25rem;
        line-height: 1;
    }
    
    
    /* Sidebar */
    
    #side {
        padding: 2rem 1.5rem;
    
        background: white;
        border-left: 1px solid #d4d4d8;
    }
    
    #sidebar {
        width: 100%;
    }
    
    .user-login {
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
    }
    
    .user-login h3 {
        margin: 0 0 0.5rem;
    }
    
    
    /* Forms */
    
    form {
        display: flex;
        flex-direction: column;
        gap: 1rem;
    }
    
    .form-field {
        display: flex;
        flex-direction: column;
        gap: 0.35rem;
    }
    
    .form-field label {
        font-size: 0.9rem;
        font-weight: 600;
    }
    
    input,
    textarea {
        width: 100%;
    
        padding: 0.6rem 0.7rem;
    
        border: 1px solid #a1a1aa;
        border-radius: 0.375rem;
    
        background: white;
        color: #18181b;
    
        outline: none;
    }
    
    input:focus,
    textarea:focus {
        border-color: #18181b;
        box-shadow: 0 0 0 2px rgb(24 24 27 / 10%);
    }
    
    textarea {
        resize: vertical;
        min-height: 100px;
    }
    
    form button {
        padding: 0.6rem 0.8rem;
    
        border: 1px solid #18181b;
        border-radius: 0.375rem;
    
        background: #18181b;
        color: white;
    }
    
    form button:hover {
        background: #3f3f46;
    }
    
    form button[type="button"] {
        background: white;
        color: #18181b;
    }
    
    form button[type="button"]:hover {
        background: #f4f4f5;
    }
    
    button:disabled {
        cursor: not-allowed;
        opacity: 0.4;
    }
    
    .error {
        color: #dc2626;
        font-size: 0.8rem;
    }
    
    
    /*  Forums */
    
    .forum-list {
        display: flex;
        flex-direction: column;
        gap: 0.4rem;
    }
    
    .forum-item {
        width: 100%;
    
        padding: 0.8rem 1rem;
    
        border: 1px solid #d4d4d8;
        border-radius: 0.375rem;
    
        background: white;
        color: #18181b;
    
        text-align: left;
    
        transition:
            background 120ms ease,
            border-color 120ms ease;
    }
    
    .forum-item:hover {
        background: #f4f4f5;
    }
    
    .forum-item.selected {
        border-color: #18181b;
        background: #e4e4e7;
        font-weight: 600;
    }
    
    
    /* Posts */
    
    .post-list {
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
    }
    
    .post-item {
        padding: 1rem;
    
        border: 1px solid #d4d4d8;
        border-radius: 0.5rem;
    
        background: white;
    }
    
    .post-header {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
    
        gap: 1rem;
        margin-bottom: 0.75rem;
    
        font-size: 0.85rem;
    }
    
    .post-header strong {
        font-size: 0.9rem;
    }
    
    .post-header time {
        color: #71717a;
    }
    
    .post-content {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
    }
    
    
    /* Modal */
    
    .modal {
        position: fixed;
        inset: 0;
    
        display: flex;
        align-items: center;
        justify-content: center;
    
        padding: 1rem;
    
        z-index: 100;
    }
    
    .modal-backdrop {
        position: absolute;
        inset: 0;
    
        background: rgb(0 0 0 / 50%);
    }
    
    .modal-content {
        position: relative;
        z-index: 1;
    
        width: min(100%, 500px);
        max-height: calc(100vh - 2rem);
    
        overflow-y: auto;
    
        padding: 1.5rem;
    
        border-radius: 0.75rem;
    
        background: white;
        box-shadow: 0 20px 50px rgb(0 0 0 / 20%);
    }
    
    .modal-content h3 {
        margin: 0;
        font-size: 1.2rem;
    }
    
    .modal-actions {
        display: flex;
        justify-content: flex-end;
        gap: 0.5rem;
    }
    
    
    /* HTMX */
    
    .htmx-request {
        cursor: wait;
    }
    
    .htmx-request button {
        cursor: wait;
    }
    
    
    /* Responsive */
    
    @media (max-width: 700px) {
        body {
            display: block;
        }
    
        #side {
            border-top: 1px solid #d4d4d8;
            border-left: 0;
        }
    
        main {
            padding: 1rem;
        }
    
        header {
            padding: 1rem;
        }
    
        .post-header {
            flex-direction: column;
            gap: 0.25rem;
        }
    }
    </style>
</head>

<body>
    <div id="main">
        <header>
            <h1>MY FORUM</h1>
        </header>

        <main>
            {% block content %}
            {% endblock %}
        </main>
    </div>
    <aside id="side">
        {% block sidebar %}
            {% include "forum/sidebar.html" %}
        {% endblock %}
    </aside>
</body>
<script>
    document.addEventListener("alpine:init", () => {
        Alpine.store("auth", {
            loggedin: {% if user.is_authenticated %}true{% else %}false{% endif %}
        })
    })
</script>
</html>
