<article class="post-item">
    <div class="post-header">
        <strong>
            {{ post.author.username }}
        </strong>
        <time datetime="{{ post.created_at|date:'c' }}">
            {{ post.created_at|date:"d M Y H:i" }}
        </time>
    </div>
    <div class="post-content">
        {{ post.message }}
    </div>
</article>
