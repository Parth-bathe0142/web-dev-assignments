<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notes Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="min-h-screen bg-gray-100 py-10 px-4">
    <div
        x-data="notesManager()"
        class="mx-auto max-w-2xl"
    >
        <!-- Header -->
        <div class="mb-8 text-center">
            <h1 class="text-4xl font-bold text-gray-800">
                Notes Manager
            </h1>

            <p class="mt-2 text-gray-500">
                Create, edit and organize your notes
            </p>
        </div>
        <!-- Add Note Form -->
        <div class="rounded-xl bg-white p-5 shadow-md">
            <div class="flex flex-col gap-3 sm:flex-row">
                <input
                    type="text"
                    x-model="newNote"
                    @keydown.enter="addNote()"
                    placeholder="Enter your note..."
                    class="flex-1 rounded-lg border border-gray-300 px-4 py-3
                           outline-none transition
                           focus:border-blue-500 focus:ring-2 focus:ring-blue-200"
                >
                <button
                    @click="addNote()"
                    class="rounded-lg bg-blue-600 px-6 py-3 font-semibold text-white
                           transition hover:bg-blue-700 active:scale-95"
                >
                    Add Note
                </button>
            </div>
        </div>
        <div class="mt-6 flex items-center justify-between">
            <h2 class="text-xl font-semibold text-gray-700">
                My Notes
            </h2>

            <span
                class="rounded-full bg-blue-100 px-4 py-1 text-sm font-semibold text-blue-700"
                x-text="`${notes.length} ${notes.length === 1 ? 'Note' : 'Notes'}`"
            ></span>
        </div>
        <div
            x-show="notes.length === 0"
            x-transition
            class="mt-5 rounded-xl border-2 border-dashed border-gray-300
                   bg-white p-10 text-center"
        >
            <div class="text-4xl">📝</div>

            <p class="mt-3 font-medium text-gray-600">
                No notes yet
            </p>

            <p class="mt-1 text-sm text-gray-400">
                Add your first note above.
            </p>
        </div>
        <div class="mt-5 space-y-4">
            <template x-for="(note, index) in notes" :key="note.id">
                <div
                    class="rounded-xl bg-white p-5 shadow-md transition"
                    :class="note.important
                        ? 'border-l-4 border-yellow-400'
                        : 'border-l-4 border-transparent'"
                >
                    <template x-if="note.editing">
                        <div class="space-y-3">
                            <input
                                type="text"
                                x-model="note.text"
                                @keydown.enter="saveNote(note)"
                                @keydown.escape="cancelEdit(note)"
                                class="w-full rounded-lg border border-blue-400 px-4 py-3
                                       outline-none focus:ring-2 focus:ring-blue-200"
                            >
                            <div class="flex gap-2">
                                <button
                                    @click="saveNote(note)"
                                    class="rounded-lg bg-green-600 px-4 py-2
                                           text-sm font-semibold text-white
                                           hover:bg-green-700"
                                >
                                    Save
                                </button>
                                <button
                                    @click="cancelEdit(note)"
                                    class="rounded-lg bg-gray-200 px-4 py-2
                                           text-sm font-semibold text-gray-700
                                           hover:bg-gray-300"
                                >
                                    Cancel
                                </button>
                            </div>
                        </div>
                    </template>
                    <template x-if="!note.editing">
                        <div>
                            <div class="flex items-start justify-between gap-4">
                                <div class="flex-1">
                                    <p
                                        class="break-words text-gray-800"
                                        :class="note.important
                                            ? 'font-semibold'
                                            : ''"
                                        x-text="note.text"
                                    ></p>
                                    <span
                                        x-show="note.important"
                                        class="mt-2 inline-block rounded-full
                                               bg-yellow-100 px-3 py-1 text-xs
                                               font-semibold text-yellow-700"
                                    >
                                        ★ Important
                                    </span>
                                </div>
                            </div>
                            <div class="mt-4 flex flex-wrap gap-2">

                                <button
                                    @click="toggleImportant(note)"
                                    class="rounded-lg px-3 py-2 text-sm font-medium transition"
                                    :class="note.important
                                        ? 'bg-yellow-100 text-yellow-700 hover:bg-yellow-200'
                                        : 'bg-gray-100 text-gray-600 hover:bg-gray-200'"
                                >
                                    <span x-text="note.important
                                        ? 'Unmark Important'
                                        : 'Mark Important'">
                                    </span>
                                </button>
                                <button
                                    @click="editNote(note)"
                                    class="rounded-lg bg-blue-100 px-4 py-2
                                           text-sm font-medium text-blue-700
                                           hover:bg-blue-200"
                                >
                                    Edit
                                </button>
                                <button
                                    @click="deleteNote(index)"
                                    class="rounded-lg bg-red-100 px-4 py-2
                                           text-sm font-medium text-red-700
                                           hover:bg-red-200"
                                >
                                    Delete
                                </button>
                            </div>
                        </div>
                    </template>
                </div>
            </template>
        </div>
    </div>
    <script>
        function notesManager() {
            return {
                newNote: '',
                notes: [],

                addNote() {
                    const text = this.newNote.trim();

                    if (text === '') {
                        return;
                    }

                    this.notes.push({
                        id: Date.now(),
                        text: text,
                        important: false,
                        editing: false,
                        originalText: text
                    });

                    this.newNote = '';
                },

                editNote(note) {
                    note.originalText = note.text;
                    note.editing = true;
                },

                saveNote(note) {
                    const text = note.text.trim();

                    if (text === '') {
                        return;
                    }

                    note.text = text;
                    note.editing = false;
                },

                cancelEdit(note) {
                    note.text = note.originalText;
                    note.editing = false;
                },

                deleteNote(index) {
                    this.notes.splice(index, 1);
                },

                toggleImportant(note) {
                    note.important = !note.important;
                }
            };
        }
    </script>
</body>
</html>
